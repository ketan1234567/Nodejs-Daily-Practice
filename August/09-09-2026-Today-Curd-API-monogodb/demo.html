<!DOCTYPE html>
<html>
<head>
  <title>Flexbox Example</title>

  <style>
    .container {
      width: 600px;
      height: 300px;
      border: 2px solid black;

      display: flex;

      /* Horizontal alignment */
      justify-content: center;

      /* Vertical alignment */
      align-items: center;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: lightblue;

      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">
      Box
    </div>

  </div>

</body>
</html>
