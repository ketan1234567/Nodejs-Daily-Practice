<!doctype html>
<html lang="en">
    <head>
        <title>Bootstrap Example</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <!-- <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script> -->
    </head>
    <body class="bg-light">
        <nav class="bg-dark navbar navbar-dark">
            <div class="container">
                <a class="fw-bold fs-4 navbar-brand" href="#"> Admin Panel </a>

                <button class="btn btn-secondary" type="button" id="logoutBtn">Logout</button>
            </div>
        </nav>

        <div class="container py-4">
            <div class="align-items-center d-flex justify-content-between mb-4">
                <h1 class="fw-bold mb-0">Leads</h1>

                <button class="btn btn-dark" type="button" id="refreshBtn">Refresh</button>
            </div>

            <div id="formMessage"></div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search leads..." />
                </div>
            </div>

            <div id="leadsContainer"></div>
        </div>

        <!-- EDIT MODAL -->

        <div class="fade modal" aria-hidden="true" id="editLeadModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Lead</h5>

                        <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="editLeadForm">
                            <input id="editId" type="hidden" />

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editFirstName"> First Name </label>

                                    <input id="editFirstName" class="form-control" required />
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editLastName"> Last Name </label>

                                    <input id="editLastName" class="form-control" required />
                                </div>
                            </div>

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editEmail"> Email </label>

                                    <input id="editEmail" class="form-control" required type="email" />
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editPhone"> Phone </label>

                                    <input id="editPhone" class="form-control" required />
                                </div>
                            </div>

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editCompany"> Company </label>

                                    <input id="editCompany" class="form-control" required />
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editJobTitle"> Job Title </label>

                                    <input id="editJobTitle" class="form-control" required />
                                </div>
                            </div>

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editCity"> City </label>

                                    <input id="editCity" class="form-control" required />
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label class="form-label" for="editCountry"> Country </label>

                                    <select class="form-select" id="editCountry" required>
                                        <option value="">Select Country</option>

                                        <option value="India">India</option>

                                        <option value="USA">USA</option>

                                        <option value="UK">United Kingdom</option>

                                        <option value="Canada">Canada</option>

                                        <option value="Australia">Australia</option>

                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="editMessage"> Message </label>

                                <textarea class="form-control" id="editMessage" required rows="4"> </textarea>
                            </div>
                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Close</button>

                        <button class="btn btn-dark" type="submit" form="editLeadForm">Update Lead</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- DELETE MODAL -->

        <div class="fade modal" aria-hidden="true" id="deleteLeadModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Delete Lead</h5>

                        <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <p class="mb-0">Are you sure you want to delete this lead?</p>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>

                        <button class="btn btn-danger" type="button" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script>
            const token = localStorage.getItem("token");

            // Token नाही तर login page

            if (!token) {
                window.location.href = "login.html";
            }

            let currentPage = 1;
            let limit = 5;
            let totalPages = 1;

            // ================================================
            // GET LEADS
            // ================================================

            async function getLeads() {
                try {
                    const search = document.getElementById("searchInput").value.trim();

                    console.log("SEARCH VALUE:", search);

                    const response = await axios.get(
                        `http://localhost:3000/api/leads?page=${currentPage}&limit=${limit}&search=${encodeURIComponent(search)}`,
                        {
                            headers: {
                                Authorization: `Bearer ${token}`,
                            },
                        }
                    );

                    console.log("FULL RESPONSE:", response.data);

                    const leads = response.data.data;

                    const pagination = response.data.pagination;

                    currentPage = pagination.currentPage;

                    totalPages = pagination.totalPages;

                    const container = document.getElementById("leadsContainer");

                    // ================= NO DATA =================

                    if (!leads || leads.length === 0) {
                        container.innerHTML = `
                <div class="alert alert-info">
                    No leads found.
                </div>
            `;

                        return;
                    }

                    // ================= TABLE =================

                    container.innerHTML = `

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle mb-0">

                            <thead class="table-dark">

                                <tr>

                                    <th>ID</th>

                                    <th>First Name</th>

                                    <th>Last Name</th>

                                    <th>Email</th>

                                    <th>Phone</th>

                                    <th>Company</th>

                                    <th>Job Title</th>

                                    <th>City</th>

                                    <th>Country</th>

                                    <th>Message</th>

                                    <th>Created</th>

                                    <th>Action</th>

                                </tr>

                            </thead>


                            <tbody>

                                ${leads
                                    .map(
                                        (lead) => `

                                    <tr>

                                        <td>${lead.id}</td>

                                        <td>${lead.firstName}</td>

                                        <td>${lead.lastName}</td>

                                        <td>${lead.email}</td>

                                        <td>${lead.phone}</td>

                                        <td>${lead.company}</td>

                                        <td>${lead.jobTitle}</td>

                                        <td>${lead.city}</td>

                                        <td>${lead.country}</td>

                                        <td>${lead.message}</td>

                                        <td>${lead.created_at}</td>


                                        <td>

                                            <div class="d-flex gap-2">

                                                <button
                                                    class="btn btn-sm btn-dark"
                                                    onclick='openEditModal(${JSON.stringify(lead)})'
                                                >
                                                    Edit
                                                </button>


                                                <button
                                                    class="btn btn-sm btn-danger"
                                                    onclick="openDeleteModal(${lead.id})"
                                                >
                                                    Delete
                                                </button>

                                            </div>

                                        </td>

                                    </tr>

                                `
                                    )
                                    .join("")}

                            </tbody>

                        </table>

                    </div>


                    <!-- Pagination -->

                    <div class="d-flex justify-content-between align-items-center mt-3">

                        <button
                            class="btn btn-outline-dark"
                            onclick="previousPage()"
                            ${currentPage === 1 ? "disabled" : ""}
                        >
                            Previous
                        </button>


                        <span class="fw-bold">

                            Page ${pagination.currentPage}
                            of
                            ${pagination.totalPages}

                        </span>


                        <button
                            class="btn btn-outline-dark"
                            onclick="nextPage()"
                            ${currentPage === pagination.totalPages ? "disabled" : ""}
                        >
                            Next
                        </button>

                    </div>

                </div>

            </div>

        `;
                } catch (error) {
                    console.log(error);

                    let message = "Unable to load leads.";

                    if (error.response) {
                        message = error.response.data.message || message;
                    }

                    document.getElementById("leadsContainer").innerHTML = `

            <div class="alert alert-danger">

                ${message}

            </div>

        `;
                }
            }

            // ================================================
            // PREVIOUS PAGE
            // ================================================

            function previousPage() {
                if (currentPage > 1) {
                    currentPage--;

                    getLeads();
                }
            }

            // ================================================
            // NEXT PAGE
            // ================================================

            function nextPage() {
                if (currentPage < totalPages) {
                    currentPage++;

                    getLeads();
                }
            }

            // ================================================
            // SEARCH
            // ================================================

            document.getElementById("searchInput").addEventListener("input", function () {
                currentPage = 1;

                getLeads();
            });

            // ================================================
            // FIRST LOAD
            // ================================================

            //getLeads();

            // ================================================
            // OPEN EDIT MODAL
            // ================================================

            function openEditModal(lead) {
                // Existing data fill

                document.getElementById("editId").value = lead.id;

                document.getElementById("editFirstName").value = lead.firstName;

                document.getElementById("editLastName").value = lead.lastName;

                document.getElementById("editEmail").value = lead.email;

                document.getElementById("editPhone").value = lead.phone;

                document.getElementById("editCompany").value = lead.company;

                document.getElementById("editJobTitle").value = lead.jobTitle;

                document.getElementById("editCity").value = lead.city;

                document.getElementById("editCountry").value = lead.country;

                document.getElementById("editMessage").value = lead.message;

                // Open Bootstrap Modal

                const modalElement = document.getElementById("editLeadModal");

                const modal = new bootstrap.Modal(modalElement);

                modal.show();
            }

            // ================================================
            // UPDATE LEAD
            // ================================================

            document.getElementById("editLeadForm").addEventListener("submit", async function (event) {
                event.preventDefault();

                const id = document.getElementById("editId").value;

                // Updated data

                const data = {
                    firstName: document.getElementById("editFirstName").value.trim(),

                    lastName: document.getElementById("editLastName").value.trim(),

                    email: document.getElementById("editEmail").value.trim(),

                    phone: document.getElementById("editPhone").value.trim(),

                    company: document.getElementById("editCompany").value.trim(),

                    jobTitle: document.getElementById("editJobTitle").value.trim(),

                    city: document.getElementById("editCity").value.trim(),

                    country: document.getElementById("editCountry").value,

                    message: document.getElementById("editMessage").value.trim(),
                };

                try {
                    // Axios PUT

                    const response = await axios.put(
                        `http://localhost:3000/api/leads/${id}`,

                        data,

                        {
                            headers: {
                                Authorization: `Bearer ${token}`,
                            },
                        }
                    );

                    console.log(response.data);

                    // Close modal

                    const modalElement = document.getElementById("editLeadModal");

                    const modal = bootstrap.Modal.getInstance(modalElement);

                    modal.hide();

                    // Refresh table

                    await getLeads();

                    // Success message

                    document.getElementById("formMessage").innerHTML = `

                        <div class="alert alert-success">

                            ${response.data.message}

                        </div>

                    `;
                } catch (error) {
                    console.log(error);

                    alert(error.response?.data?.message || "Unable to update lead.");
                }
            });

            // ================================================
            // DELETE ID
            // ================================================

            let deleteLeadId = null;

            // ================================================
            // OPEN DELETE MODAL
            // ================================================

            function openDeleteModal(id) {
                deleteLeadId = id;

                const modalElement = document.getElementById("deleteLeadModal");

                const modal = new bootstrap.Modal(modalElement);

                modal.show();
            }

            // ================================================
            // CONFIRM DELETE
            // ================================================

            document.getElementById("confirmDeleteBtn").addEventListener("click", async function () {
                if (!deleteLeadId) {
                    return;
                }

                try {
                    // Axios DELETE

                    const response = await axios.delete(
                        `http://localhost:3000/api/leads/${deleteLeadId}`,

                        {
                            headers: {
                                Authorization: `Bearer ${token}`,
                            },
                        }
                    );

                    console.log(response.data);

                    // Close modal

                    const modalElement = document.getElementById("deleteLeadModal");

                    const modal = bootstrap.Modal.getInstance(modalElement);

                    modal.hide();

                    // Reset ID

                    deleteLeadId = null;

                    // Refresh table

                    await getLeads();

                    // Success message

                    document.getElementById("formMessage").innerHTML = `

                        <div class="alert alert-success">

                            ${response.data.message}

                        </div>

                    `;
                } catch (error) {
                    console.log(error);

                    alert(error.response?.data?.message || "Unable to delete lead.");
                }
            });

            // ================================================
            // REFRESH BUTTON
            // ================================================

            document.getElementById("refreshBtn").addEventListener("click", function () {
                getLeads();
            });

            // ================================================
            // LOGOUT
            // ================================================

            document.getElementById("logoutBtn").addEventListener("click", function () {
                localStorage.removeItem("token");

                localStorage.removeItem("user");

                window.location.href = "login.html";
            });

            // ================================================
            // PAGE LOAD
            // ================================================

            getLeads();
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
