<!doctype html>
<html lang="en">
    <meta charset="UTF-8" /><meta content="width=device-width,initial-scale=1" name="viewport" /><title>
       Admin Signup</title
    ><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <body class="bg-light">
        <div class="container">
            <div class="align-items-center justify-content-center row" style="min-height: 100vh">
                <div class="col-12 col-lg-4 col-md-6 col-sm-10">
                    <div class="border-0 card shadow">
                        <div class="card-body p-4">
                            <h2 class="text-center fw-bold mb-4">Admin Signup</h2>
                            <form id="loginForm">
							                         <div class="mb-3">
                                    <input
                                        class="form-control"
                                        id="name"
                                        name="name"
                                        placeholder="Name"
                                        required
                                        type="text"
                                    />
                                </div>
                                <div class="mb-3">
                                    <input
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="Email"
                                        required
                                        type="email"
                                    />
                                </div>
                                <div class="mb-3">
                                    <input
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Password"
                                        required
                                        type="password"
                                    />
                                </div>
                                <button class="btn btn-dark w-100" type="submit">Signup</button>
                                <p class="text-center mb-0 mt-3">
                                    Don't have an account? <a href="login.html">Login</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
		<script>
		document.getElementById("loginForm").addEventListener("submit", async function (event) {

    event.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const data = {
	 name: name,
        email: email,
        password: password
    };

    try {

        const response = await axios.post(
            "http://localhost:3000/api/auth/signup",
            data
        );

        console.log(response.data);

        // Token save
        localStorage.setItem("token", response.data.token);

        // User data save
        localStorage.setItem(
            "user",
            JSON.stringify(response.data.user)
        );

        // Dashboard redirect
        window.location.href = "login.html";

    } catch (error) {

        console.log(error);

        if (error.response) {

            alert(
                error.response.data.message ||
                "Login failed"
            );

        } else {

            alert("Server is not running");

        }
    }

});
		
		</script>
		
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    </body>
</html>
